name: refresh-demo-feeds

# The testnet demo runs on owner-written DemoFeeds — Robinhood Chain testnet publishes
# no stock feeds — and the protocol refuses to quote or settle against a price older
# than each asset's staleness bound (3 days). Without this cron, any reviewer opening
# the app a few days after the last manual demo sees StalePrice on every quote.
#
# FEED_WRITER_KEY signs the price writes. DemoFeed.owner is immutable (set at deploy),
# so this must be the deployer key — keep it a testnet-only key, never a mainnet one.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — bound is 3 days, this leaves margin
  workflow_dispatch: {}

concurrency:
  group: refresh-demo-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Refresh feed prices
        env:
          REGISTRY: "0xb7Dbaa2bC029eb1DE0C7D1929aE9402f857b49A7"
          FEED_WRITER_KEY: ${{ secrets.FEED_WRITER_KEY }}
        # The key must reach forge as --private-key, not merely as a PRIVATE_KEY env:
        # with the env-only form every scheduled run simulated from forge's default
        # sender and reverted NotOwner() on each DemoFeed.set().
        run: |
          if [ -z "$FEED_WRITER_KEY" ]; then echo "::error::FEED_WRITER_KEY secret is empty" >&2; exit 1; fi
          forge script script/RefreshFeeds.s.sol \
            --rpc-url https://rpc.testnet.chain.robinhood.com/rpc \
            --broadcast \
            --private-key "$FEED_WRITER_KEY"

      - name: Verify every active feed is fresh
        # A partial refresh (one asset skipped or a non-owner key that only some feeds
        # accept) would otherwise pass a TSLA-only check while another asset silently
        # ages past its bound and breaks that asset's quote on the deployed demo.
        env:
          FEEDS: "0x9b1be514E2dBAA52FB37B52f65E57885FD5c67D8 0x81ec7fa98007ed222352c1fa1a0dc9321fcd90b4 0x95ea4e74cd1da493306c1ce022dfe71c9f0f38b1 0x8259e052164fb94f93488a210799b53fc13fa842 0x8c3535b6f4bf1cfbe9ed31ff669e173d8b594819"
        run: |
          NOW=$(date +%s)
          for FEED in $FEEDS; do
            UPD=$(cast call "$FEED" "latestRoundData()(uint80,int256,uint256,uint256,uint80)" --rpc-url https://rpc.testnet.chain.robinhood.com/rpc | sed -n 4p | cut -d'[' -f1 | tr -d '[:space:]')
            AGE=$((NOW - UPD))
            echo "$FEED age: ${AGE}s"
            test "$AGE" -lt 259200 || { echo "::error::$FEED is stale (${AGE}s)"; exit 1; }
          done
